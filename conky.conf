conky.config = {
    alignment = 'top_right',

    -- Deve restare false: il watcher gestisce il processo Conky.
    background = false,
    border_width = 0,

    cpu_avg_samples = 2,

    default_color = '#e0e0e0',
    default_shade_color = '#000000',

    double_buffer = true,

    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = true,

    gap_x = 30,
    gap_y = 40,

    maximum_width = 340,
    minimum_width = 340,

    no_buffers = true,

    out_to_x = false,
    out_to_wayland = true,

    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',

    own_window_colour = '#18181b',

    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    update_interval = 0.5,

    use_xft = true,
    font = 'JetBrains Mono:size=11',
};

conky.text = [[

${offset 16}${color #00F730}SYSTEM${alignr 16}───────────────────────────

${offset 16}${color #c0caf5}CPU      ${alignr 16}${cpu}%  •  ${freq_g} GHz
${offset 16}${cpubar 6,308}

${offset 16}${color #c0caf5}RAM      ${alignr 16}${execi 2 free -b | awk '/Mem:/ {printf "%.2f", $3/1073741824}'} / ${execi 10 free -b | awk '/Mem:/ {printf "%.2f GB", $2/1073741824}'}
${offset 16}${membar 6,308}

${offset 16}${color #c0caf5}Temp     ${alignr 16}${execi 2 sensors | awk '/^Tctl:/ {print $2; exit}' | tr -d '+'}

${offset 16}${color #c0caf5}Governor ${alignr 16}${execi 10 cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor}

${offset 16}${color #c0caf5}EPP      ${alignr 16}${execi 10 cat /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_preference}

${offset 16}${color #c0caf5}Kernel   ${alignr 16}${kernel}


${offset 16}${color #00F730}GPU (Radeon 780M)${alignr 16}────────────────

${offset 16}${color #c0caf5}Uso       ${alignr 16}${execi 1 cat /sys/class/drm/card*/device/gpu_busy_percent 2>/dev/null | head -1}%

${offset 16}${color #c0caf5}Power     ${alignr 16}${execi 1 awk '{printf "%.1f W", $1/1000000}' /sys/class/drm/card1/device/hwmon/hwmon2/power1_average}

${offset 16}${color #c0caf5}Frequenza ${alignr 16}${execi 1 cat /sys/class/drm/card*/device/pp_dpm_sclk 2>/dev/null | grep '*' | awk '{print $2}' | sed -E 's/[Mm][Hh][Zz]$//' | head -1} MHz

${offset 16}${color #c0caf5}VRAM      ${alignr 16}${execi 2 cat /sys/class/drm/card*/device/mem_info_vram_used 2>/dev/null | head -1 | awk '{printf "%.2f", $1/1000000000}'} / ${execi 10 cat /sys/class/drm/card*/device/mem_info_vram_total 2>/dev/null | head -1 | awk '{printf "%.2f GB", $1/1000000000}'}
${offset 16}${execibar 2 6,308 sh -c 'used=$(cat /sys/class/drm/card*/device/mem_info_vram_used 2>/dev/null | head -1); total=$(cat /sys/class/drm/card*/device/mem_info_vram_total 2>/dev/null | head -1); [ "$total" -gt 0 ] && echo $((used * 100 / total))'}

${offset 16}${color #c0caf5}Temp      ${alignr 16}${execi 2 sensors | awk '/^amdgpu-/,/^$/ {if ($1 == "edge:") {print $2; exit}}' | tr -d '+'}


${offset 16}${color #00F730}STORAGE${alignr 16}──────────────────────────

${offset 16}${color #c0caf5}Root      ${alignr 16}${execi 10 df -B1 / | awk 'NR==2 {printf "%.2f / %.2f GB", $3/1000000000, $2/1000000000}'}
${offset 16}${fs_bar 6,308 /}


${offset 16}${color #00F730}NETWORK${alignr 16}──────────────────────────

${offset 16}${color #c0caf5}Download ${alignr 16}${downspeed wlan0}
${offset 16}${downspeedgraph wlan0 24,308 4c8bf5 EE24F9}

${offset 16}${color #c0caf5}Upload ${alignr 16}${upspeed wlan0}
${offset 16}${upspeedgraph wlan0 24,308 EE24F9 4c8bf5}

${offset 16}${color #c0caf5}IP locale ${alignr 16}${addr wlan0}

${offset 16}${color #c0caf5}Canale Wi-Fi ${alignr 16}${execi 10 sh -c 'channel=$(iw dev wlan0 info 2>/dev/null | awk "/channel/ {print \$2; exit}"); printf "%s" "${channel:-No Channel}"'}

${offset 16}${color #c0caf5}DNS ${alignr 16}${execi 10 nmcli -g IP4.DNS device show wlan0 2>/dev/null | sed 's/ | / - /g' | awk 'NF {dns=dns (dns ? ", " : "") $0} END {print dns ? dns : "No DNS"}'}

]];
